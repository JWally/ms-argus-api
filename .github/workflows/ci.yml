name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint TypeScript (ESLint)
        run: npm run lint:test

  test-node:
    name: Test Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: node
          fail_ci_if_error: false

      - name: Check coverage thresholds
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.statements.pct')
          echo "Statement coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 25" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 25% threshold"
            exit 1
          fi

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency rules (no circular deps, layering)
        run: npm run deps

      - name: Dead code detection (unused exports, files, deps)
        run: npm run dead-code

      - name: Duplication detection (copy-paste)
        run: npm run duplication

  semgrep:
    name: Semgrep Anti-Pattern Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep with custom rules
        run: semgrep scan --config .semgrep/ --error src/ lib/

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation testing
        run: npm run mutate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-node, quality, semgrep]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: CDK Synth
        env:
          # Synth only — no live AWS calls. Account/region are read by
          # bin/config.ts and used purely to key the cached cdk.context.json.
          # Account ID is already committed in cdk.context.json.
          CDK_DEFAULT_ACCOUNT: "263318538229"
          CDK_DEFAULT_REGION: us-east-1
        run: npm run synth

  cdk-diff:
    name: CDK Diff
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: CDK Diff
        run: npm run diff 2>&1 | tee cdk-diff.txt || true
        continue-on-error: true

      - name: Comment PR with diff
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const diff = fs.existsSync('cdk-diff.txt')
              ? fs.readFileSync('cdk-diff.txt', 'utf8')
              : 'CDK diff not available (AWS credentials not configured)';

            const body = `## CDK Diff Preview

            <details>
            <summary>Click to expand</summary>

            \`\`\`
            ${diff.substring(0, 60000)}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        continue-on-error: true
