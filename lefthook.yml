# lefthook.yml
# Git hooks configuration for ms-argus-api

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: npm run build
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx}"
      run: npx eslint {staged_files} --max-warnings 50
    format:
      glob: "*.{ts,tsx,json,md,yml,yaml}"
      run: npx prettier --check {staged_files}

pre-push:
  parallel: true
  commands:
    test:
      run: npm run test:coverage
    e2e:
      run: npm run test:e2e
    cleanup-ratchets:
      run: npm run test:cleanup-ratchets
    typecheck:
      run: npm run build
    deps:
      run: npm run deps
    dead-code:
      run: npm run dead-code
    duplication:
      run: npm run duplication
